<div class="ab__bg" aria-hidden="true"></div>
<div class="ab__pin">
<div class="ab__content">
<h2 class="ab__title" id="ab-title">аксиа&nbsp;— команда консультантов в&nbsp;сфере стратегического управления и&nbsp;корпоративных коммуникаций</h2>
<div class="ab__side">
<p class="ab__text ab__text--1">Нас объединяют многолетний опыт совместной работы, глубокое знание своей сферы, широкий профессиональный кругозор и&nbsp;высокие стандарты качества. Сегодня мы&nbsp;развиваем собственную консалтинговую практику, свободно сочетая разные подходы, находя нестандартные решения и&nbsp;создавая значимые результаты для клиентов.</p>
<p class="ab__text ab__text--2">Название аксиа неслучайно: древнегреческое αξία означает «ценность», «достоинство». Для нас ценности&nbsp;— предмет работы, а&nbsp;также основа профессионального взгляда. Мы&nbsp;изучаем ценности и&nbsp;интересы бизнеса и&nbsp;заинтересованных сторон, находим точки соприкосновения и&nbsp;превращаем их&nbsp;в&nbsp;стратегии, решения и&nbsp;коммуникации, создающие общую социальную пользу.</p>
</div>
</div>
</div>
</section>

<div class="tm__flow"><div class="tm__desc"><p class="{{tmQ0_0}}">Более 15&nbsp;лет в&nbsp;стратегическом и&nbsp;юридическом консалтинге. Разрабатывает корпоративные стратегии, внедряет принципы ответственного ведения бизнеса в&nbsp;корпоративное управление и&nbsp;выстраивает нефинансовую отчётность.</p><p class="{{tmQ0_1}}">В&nbsp;числе ключевых тем&nbsp;— социальное развитие территорий и&nbsp;оценка вклада бизнеса в&nbsp;достижение национальных целей. Сочетает стратегическое видение с&nbsp;глубокой экспертизой в&nbsp;области устойчивого развития и&nbsp;правового регулирования.</p><p class="{{tmQ0_2}}" data-br="1">Приглашённый преподаватель МГУ, спикер российских и&nbsp;международных форумов.</p><p class="{{tmQ0_3}}">До основания Аксиа руководила практиками устойчивого развития в&nbsp;российской и&nbsp;международной консалтинговых компаниях, в&nbsp;том числе развивая рынок Ближнего Востока. Ранее работала в&nbsp;международной юридической фирме, занимаясь корпоративным правом и&nbsp;сопровождением трансграничных сделок M&amp;A.</p><p class="{{tmQ0_4}}">Окончила юридический факультет МГУ имени М.&nbsp;В.&nbsp;Ломоносова и&nbsp;магистратуру Университета Боккони (Италия) по&nbsp;программе «Устойчивое развитие и&nbsp;энергетический менеджмент».</p></div></div>
